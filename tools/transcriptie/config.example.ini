; ---------------------------------------------------------------------------
; Configuratie voor de transcriptie-bewaker.
; Kopieer dit bestand naar  config.ini  en pas aan waar nodig.
; ---------------------------------------------------------------------------

[algemeen]
; De OneDrive-map die bewaakt wordt (en waar de .txt terugkomt).
watch_dir = C:\Users\woutv\OneDrive\Temporary

; Hoe vaak de map gecontroleerd wordt (seconden).
poll_seconds = 10

; Een audiobestand pas verwerken als de grootte zo lang niet meer verandert.
; Verhoog dit als interviews groot zijn / het internet traag is.
stable_seconds = 30

; Ook de ruwe (niet-opgekuiste) transcriptie apart wegschrijven?
schrijf_ruwe_transcriptie = false

[whisper]
; Model: tiny / base / small / medium / large-v3
;   - medium  = goede balans op een gewone pc (CPU)
;   - large-v3 = beste kwaliteit, aangeraden mét NVIDIA-GPU
model = medium

; device: auto / cpu / cuda   (auto kiest GPU indien beschikbaar)
device = auto

; compute_type: int8 (CPU, snel) / float16 (GPU) / int8_float16
compute_type = int8

; Taal van de interviews.
taal = nl

[opkuis]
; Waar de opkuis-stap draait:
;   claude  = via de Claude API (beste kwaliteit; zet ANTHROPIC_API_KEY als omgevingsvariabele)
;   ollama  = volledig lokaal via Ollama (100% privé, gratis, zwaardere installatie)
;   none    = geen opkuis; enkel de ruwe transcriptie wordt afgeleverd
mode = claude

; --- instellingen voor mode = claude ---
claude_model = claude-sonnet-5
max_tokens = 16000

; --- instellingen voor mode = ollama ---
ollama_model = llama3.1
ollama_url = http://localhost:11434
