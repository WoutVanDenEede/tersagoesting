name: Google-reviews bijwerken

on:
  schedule:
    # Elke maandag om 04:00 UTC (Google vereist regelmatige verversing)
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node opzetten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reviews ophalen
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: node scripts/fetch-google-reviews.mjs

      - name: Wijzigingen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/google-reviews.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen in de reviews."
          else
            git commit -m "reviews: Google-reviews automatisch bijgewerkt"
            git push
          fi
